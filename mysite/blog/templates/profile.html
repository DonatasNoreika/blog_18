{% extends 'base.html' %}

{% block title %}Mano profilis{% endblock %}

{% block content %}
<h1>{{ user.username }} profilis</h1>
<p>Vardas: {{ user.first_name }}</p>
<p>Pavardė: {{ user.last_name }}</p>
<p>El. paštas: {{ user.last_name }}</p>
<hr>
<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Atnaujinti</button>
</form>
{% endblock %}
