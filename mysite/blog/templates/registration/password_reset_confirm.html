{% extends 'base.html' %}

{% block title %}Slaptažodžio keitimas{% endblock %}

{% block content %}
<h1>Slaptažodžio keitimas</h1>
<p>Įveskite ir pakartokite naują slaplažodį</p>
<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary w-100">Patvirtinti</button>
</form>

{% endblock %}
